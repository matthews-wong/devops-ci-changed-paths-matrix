name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Lint shell
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Test change detection
        run: tests/changed-services.test.sh

  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.changed.outputs.services }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PR_BASE_SHA"
          if [ "$EVENT_NAME" = push ]; then
            base="$PUSH_BEFORE_SHA"
          fi
          # A first push to a branch reports an all-zero "before" sha, so there
          # is nothing to diff against: test every service instead.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            services=$(find services -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc .)
          else
            services=$(scripts/changed-services.sh "$base" "$HEAD_SHA")
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"

  test:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test ${{ matrix.service }}
        run: make -C "services/${{ matrix.service }}" test
